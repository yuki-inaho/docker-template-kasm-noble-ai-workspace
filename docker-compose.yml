services:
  workspace:
    build:
      context: .
      args:
        KASM_REPOSITORY: "kasmweb/ubuntu-noble-nvidia"
        KASM_VERSION: "1.19.0"
        NODE_VERSION: "22.23.4"
        NPM_VERSION: "12.2.1"
        POETRY_VERSION: "1.8.5"
        CODEX_VERSION: "0.163.0"
        CLAUDE_VERSION: "2.1.306"
        OPENCODE_VERSION: "2.1.2"
        PLAYWRIGHT_VERSION: "1.64.1"
        PLAYWRIGHT_CLI_VERSION: "0.1.22"
    image: kasm-noble-ai-workspace:local
    restart: unless-stopped
    shm_size: "1gb"
    ports:
      - "6901:6901"
    environment:
      VNC_PW: ${VNC_PW:?Set VNC_PW in .env}
      TZ: ${TZ:-Asia/Tokyo}
      NVIDIA_DRIVER_CAPABILITIES: all
      ENABLE_JAPANESE_INPUT: "1"
      WORKSPACE_CHOWN: "1"
      AUTO_CD_WORKSPACE: "1"
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
    volumes:
      - workspace-data:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  workspace-data:
