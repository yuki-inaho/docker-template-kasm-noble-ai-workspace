name: Build and publish Docker Hub image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .dockerignore
      - scripts/**
      - .github/workflows/build-and-push.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune --all --force || true
          df -h

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Check Docker Hub token
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Repository secret DOCKERHUB_TOKEN is not set."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: yukiinaho
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker Hub image name
        id: image
        shell: bash
        run: echo "name=docker.io/yukiinaho/kasm-noble-ai" >> "$GITHUB_OUTPUT"

      - name: Generate standard image metadata
        id: meta-standard
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Generate full image metadata
        id: meta-full
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=full,enable={{is_default_branch}}
            type=ref,event=tag,suffix=-full
            type=sha,prefix=full-sha-

      - name: Test standard image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: test-standard
          platforms: linux/amd64
          pull: true
          push: false
          cache-from: type=gha,scope=image-amd64
          build-args: |
            KASM_REPOSITORY=kasmweb/ubuntu-noble-nvidia
            KASM_VERSION=1.19.0
            NODE_VERSION=22.23.2
            POETRY_VERSION=1.8.5
            CODEX_VERSION=latest

      - name: Test full image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: test-full
          platforms: linux/amd64
          pull: false
          push: false
          cache-from: type=gha,scope=image-amd64
          build-args: |
            KASM_REPOSITORY=kasmweb/ubuntu-noble-nvidia
            KASM_VERSION=1.19.0
            NODE_VERSION=22.23.2
            POETRY_VERSION=1.8.5
            CODEX_VERSION=latest

      - name: Build and push standard image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: standard
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta-standard.outputs.tags }}
          labels: ${{ steps.meta-standard.outputs.labels }}
          cache-from: type=gha,scope=image-amd64
          build-args: |
            KASM_REPOSITORY=kasmweb/ubuntu-noble-nvidia
            KASM_VERSION=1.19.0
            NODE_VERSION=22.23.2
            POETRY_VERSION=1.8.5
            CODEX_VERSION=latest

      - name: Build and push full image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: full
          platforms: linux/amd64
          pull: false
          push: true
          tags: ${{ steps.meta-full.outputs.tags }}
          labels: ${{ steps.meta-full.outputs.labels }}
          cache-from: type=gha,scope=image-amd64
          cache-to: type=gha,scope=image-amd64,mode=min,ignore-error=true
          build-args: |
            KASM_REPOSITORY=kasmweb/ubuntu-noble-nvidia
            KASM_VERSION=1.19.0
            NODE_VERSION=22.23.2
            POETRY_VERSION=1.8.5
            CODEX_VERSION=latest
