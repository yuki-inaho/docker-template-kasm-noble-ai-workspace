name: Weekly image canary

on:
  schedule:
    # Every Monday at 03:17 UTC (12:17 JST).
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-weekly-canary
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune --all --force || true
          df -h

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # This cold build deliberately uses the rolling base image, but has no
      # registry credentials and never publishes or changes release tags.
      - name: Cold-test standard image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: test-standard
          platforms: linux/amd64
          pull: true
          push: false
          no-cache: true
          build-args: |
            SECURITY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
            KASM_REPOSITORY=kasmweb/ubuntu-noble-nvidia
            KASM_VERSION=1.19.0-rolling-weekly
            NODE_VERSION=22.23.4
            NPM_VERSION=12.2.1
            POETRY_VERSION=1.8.5
            CODEX_VERSION=latest
            CLAUDE_VERSION=latest
            OPENCODE_VERSION=latest
            PLAYWRIGHT_VERSION=latest
            PLAYWRIGHT_CLI_VERSION=latest

      - name: Test full image after the cold standard build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: test-full
          platforms: linux/amd64
          pull: false
          push: false
          build-args: |
            SECURITY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
            KASM_REPOSITORY=kasmweb/ubuntu-noble-nvidia
            KASM_VERSION=1.19.0-rolling-weekly
            NODE_VERSION=22.23.4
            NPM_VERSION=12.2.1
            POETRY_VERSION=1.8.5
            CODEX_VERSION=latest
            CLAUDE_VERSION=latest
            OPENCODE_VERSION=latest
            PLAYWRIGHT_VERSION=latest
            PLAYWRIGHT_CLI_VERSION=latest
