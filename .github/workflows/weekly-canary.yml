name: Weekly image canary

on:
  schedule:
    # Every Monday at 03:17 UTC (12:17 JST).
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-weekly-canary
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune --all --force || true
          df -h

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      # This cold build deliberately uses the rolling base image, but has no
      # registry credentials and never publishes or changes release tags.
      - name: Cold-test standard image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: test-standard
          platforms: linux/amd64
          pull: true
          push: false
          no-cache: true
          build-args: |
            KASM_REPOSITORY=kasmweb/ubuntu-noble-nvidia
            KASM_VERSION=1.19.0-rolling-weekly
            NODE_VERSION=22
            POETRY_VERSION=1.8.5
            CODEX_VERSION=latest

      - name: Test full image after the cold standard build
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          target: test-full
          platforms: linux/amd64
          pull: false
          push: false
          build-args: |
            KASM_REPOSITORY=kasmweb/ubuntu-noble-nvidia
            KASM_VERSION=1.19.0-rolling-weekly
            NODE_VERSION=22
            POETRY_VERSION=1.8.5
            CODEX_VERSION=latest
